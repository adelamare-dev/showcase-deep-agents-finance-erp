[project]
name = "finance-erp-agent"
version = "0.4.0"
description = "Finance ERP deep agent powered by LangGraph and CopilotKit"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ag-ui-langgraph>=0.0.36",
  "copilotkit[langgraph]>=0.1.0",
  "deepagents>=0.1.0",
  "fastapi>=0.136.3",
  "httpx>=0.28",
  "langgraph>=0.4.0",
  "langchain>=0.3.0",
  "langchain-core>=1.4.0",
  "uvicorn>=0.34.0",
  "python-dotenv>=1.0.0",
  "langchain-mistralai>=1.1.6",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.uv]
package = false
required-version = ">=0.11"
exclude-newer = "7 days"
no-build = true

[tool.uv.audit]
malware-check = true
